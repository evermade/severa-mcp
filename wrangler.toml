name = "severa-mcp"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# account_id comes from CLOUDFLARE_ACCOUNT_ID env var (GitHub secret or local shell) at deploy time

# KV namespaces
#   OAUTH_KV   - Workers OAuth Provider stores authorization/refresh tokens + client registrations
#   CACHE_KV   - Severa bearer token, email→userGuid map, reference data cache, rate-limit buckets
#
# Create namespaces with:
#   npx wrangler kv namespace create OAUTH_KV
#   npx wrangler kv namespace create CACHE_KV
# Then paste the returned IDs below.

kv_namespaces = [
  { binding = "OAUTH_KV", id = "0f4cbc5ccd4b49baa0b6056f5dfdc306" },
  { binding = "CACHE_KV", id = "d835cb2f570a482491945b0a64c37b5a" },
]

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[vars]
SEVERA_ENV = "prod"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "evermade.fi"
ENABLE_WRITE_TOOLS = "false"

[env.staging]
name = "severa-mcp-staging"
kv_namespaces = [
  { binding = "OAUTH_KV", id = "fa1aea42fd1d4b5d8516d3d93b48fd7c" },
  { binding = "CACHE_KV", id = "ccc93168c70844c7a0d77300c97c88c7" },
]

[env.staging.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[env.staging.vars]
SEVERA_ENV = "stag"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "evermade.fi"
ENABLE_WRITE_TOOLS = "false"

[env.production]
name = "severa-mcp"
kv_namespaces = [
  { binding = "OAUTH_KV", id = "bb71ae63004d47c68d0f94e139eeb745" },
  { binding = "CACHE_KV", id = "de16d5cea0f44569ac48a47c010c2007" },
]

[env.production.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[env.production.vars]
SEVERA_ENV = "prod"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "genero.fi"
ENABLE_WRITE_TOOLS = "false"

# Secrets (set via `wrangler secret put ... --env staging|production`):
#   SEVERA_CLIENT_ID
#   SEVERA_CLIENT_SECRET
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   COOKIE_ENCRYPTION_KEY
#   SEVERA_EMAIL_MAP  - JSON map of login email → Severa email, e.g. '{"you@co.com":"you@co.com"}'
#
#   Role-derived permission scoping (src/authz.ts) — comma-separated lists of
#   normalized Severa `permissionProfile.name` values (a " - Team" suffix, e.g.
#   "Account Director - Rytmiryhmä", is stripped before matching; case-insensitive).
#   If SEVERA_FULL_ACCESS_ROLES, SEVERA_BUSINESS_ONLY_ROLES, and
#   SEVERA_SELF_ONLY_ROLES are ALL unset, this is a no-op — every caller keeps
#   today's unrestricted access. Once any is set, a role not listed in any of
#   the three is rejected outright.
#   SEVERA_FULL_ACCESS_ROLES          - e.g. "Pääkäyttäjä" — sees everyone, every tool, incl. severa_query
#   SEVERA_BUSINESS_ONLY_ROLES        - e.g. "Account Director,Project Manager" — sees everyone within allowed tool categories
#   SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS - e.g. "travels,overtimes" — tool-file basenames not registered for the roles above
#   SEVERA_SELF_ONLY_ROLES            - e.g. "Employee" — every tool available, but personal-data tools show only the caller's own rows
