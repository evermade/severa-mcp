name = "severa-mcp"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# account_id comes from CLOUDFLARE_ACCOUNT_ID env var (GitHub secret or local shell) at deploy time

# Workers Logs: keeps console output (incl. the structured JSON lines from
# src/log.ts) queryable in the dashboard. Repeated per env to be explicit.
[observability]
enabled = true
head_sampling_rate = 1

# KV namespaces
#   OAUTH_KV   - Workers OAuth Provider stores authorization/refresh tokens + client registrations
#   CACHE_KV   - Severa bearer token, email→userGuid map, reference data cache, rate-limit buckets
#
# Create namespaces with:
#   npx wrangler kv namespace create OAUTH_KV
#   npx wrangler kv namespace create CACHE_KV
# Then paste the returned IDs below.
#
# The top level mirrors [env.production] on purpose: Workers Builds deploys
# with `--env production`, but a bare `wrangler deploy` also targets the
# `severa-mcp` worker, so it must never ship different bindings or roles.

kv_namespaces = [
  { binding = "OAUTH_KV", id = "bb71ae63004d47c68d0f94e139eeb745" },
  { binding = "CACHE_KV", id = "de16d5cea0f44569ac48a47c010c2007" },
]

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[vars]
SEVERA_ENV = "prod"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "evermade.fi"
ENABLE_WRITE_TOOLS = "false"
SEVERA_FULL_ACCESS_ROLES = "Pääkäyttäjä"
SEVERA_BUSINESS_ONLY_ROLES = "Account Director,Project Manager"
SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS = ""
SEVERA_SELF_ONLY_ROLES = "Employee"

[env.staging]
name = "severa-mcp-staging"
kv_namespaces = [
  { binding = "OAUTH_KV", id = "fa1aea42fd1d4b5d8516d3d93b48fd7c" },
  { binding = "CACHE_KV", id = "ccc93168c70844c7a0d77300c97c88c7" },
]

[env.staging.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.vars]
SEVERA_ENV = "stag"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "evermade.fi"
ENABLE_WRITE_TOOLS = "false"
SEVERA_FULL_ACCESS_ROLES = "Pääkäyttäjä"
SEVERA_BUSINESS_ONLY_ROLES = "Johto"
SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS = ""
SEVERA_SELF_ONLY_ROLES = "Työntekijä"

[env.production]
name = "severa-mcp"
kv_namespaces = [
  { binding = "OAUTH_KV", id = "bb71ae63004d47c68d0f94e139eeb745" },
  { binding = "CACHE_KV", id = "de16d5cea0f44569ac48a47c010c2007" },
]

[env.production.durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "SeveraMcpAgent" },
]

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SeveraMcpAgent"]

[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.vars]
SEVERA_ENV = "prod"
SEVERA_API_BASE_STAG = "https://api.severa.stag.visma.com/rest-api"
SEVERA_API_BASE_PROD = "https://api.severa.visma.com/rest-api"
GOOGLE_HOSTED_DOMAIN = "evermade.fi"
ENABLE_WRITE_TOOLS = "false"
SEVERA_FULL_ACCESS_ROLES = "Pääkäyttäjä"
SEVERA_BUSINESS_ONLY_ROLES = "Account Director,Project Manager"
SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS = ""
SEVERA_SELF_ONLY_ROLES = "Employee"

# Secrets (set via `wrangler secret put ... --env staging|production`):
#   SEVERA_CLIENT_ID
#   SEVERA_CLIENT_SECRET
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   COOKIE_ENCRYPTION_KEY
#   SEVERA_EMAIL_MAP  - JSON map of login email → Severa email, e.g. '{"you@co.com":"you@co.com"}'
#
# Role-derived permission scoping (src/authz.ts) is plain [vars] above, not a
# secret — the role names aren't sensitive, and keeping them in wrangler.toml
# means they're set from source on every deploy (unlike a one-off
# `wrangler secret put`, which a CI deploy doesn't touch or persist). Comma-
# separated lists of normalized Severa `permissionProfile.name` values (a
# " - Team" suffix, e.g. "Account Director - Rytmiryhmä", is stripped before
# matching; case-insensitive). If SEVERA_FULL_ACCESS_ROLES,
# SEVERA_BUSINESS_ONLY_ROLES, and SEVERA_SELF_ONLY_ROLES are ALL empty, this
# is a no-op — every caller keeps unrestricted access. Once any is non-empty,
# a role not listed in any of the three is rejected outright.
#   SEVERA_FULL_ACCESS_ROLES          - sees everyone, every tool, incl. severa_query
#   SEVERA_BUSINESS_ONLY_ROLES        - sees everyone within allowed tool categories
#   SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS - tool-file basenames not registered for the roles above, e.g. "travels,overtimes"
#   SEVERA_SELF_ONLY_ROLES            - every tool available, but personal-data tools show only the caller's own rows
#
# NOTE: if these were previously set via `wrangler secret put` on a given
# environment, delete those secrets before deploying — Cloudflare rejects a
# deploy where a [vars] name collides with an existing secret of the same
# name:
#   npx wrangler secret delete SEVERA_FULL_ACCESS_ROLES --env <env>
#   npx wrangler secret delete SEVERA_BUSINESS_ONLY_ROLES --env <env>
#   npx wrangler secret delete SEVERA_BUSINESS_ONLY_BLOCKED_TOOLS --env <env>
#   npx wrangler secret delete SEVERA_SELF_ONLY_ROLES --env <env>
